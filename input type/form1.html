<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Event Registeration</h2>
    <form>
        <label for="name">Name : </label>
        <input type="text" id="name" name="name">
        <br>
        <br>

        <label for="mail">Email : </label>
        <input type="email" id="mail" name="mail">
        <br>
        <br>

        <label for="telephone">Phone no: </label>
        <input type="tel" name="telephone" id="telephone">
        <br>
        <br>

        <label for="occupationType">Occupation : </label>
        <select name="occupationType" id="occupationType">
            <option value="student">Student</option>
            <option value="professional">Professional</option>
            <option value="other">Other</option>
        </select>
        <br>
        <br>

        <label for="checkbox1">Topics of Interest:</label> <br>
        <input type="checkbox" name="checkbox1" id="checkbox1">
        <br>
        <label for="checkbox1">HTML</label>
        <br>
        <input type="checkbox" name="checkbox2" id="checkbox2">
        <br>
        <label for="checkbox2">CSS</label>
        <br>
        <input type="checkbox" name="checkbox3" id="checkbox3">
        <br>
        <label for="checkbox3">JavaScript</label>
        <br>
        <br>


        <label for="textarea1">Comments : </label>
        <br>
        <textarea name="textarea1" id="textarea1" cols="15" rows="5"></textarea>


        <input type="submit" value="Register">
        <br>
        <br>

        <label for="counter">Experiene in years</label>
        <input type="number" name="counter" id="counter" min="0" max="50">

    </form>
</body>
</html>
