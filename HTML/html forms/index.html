<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>

    <fieldset>  <!-- isse sara form rectangular box me agya-->
        <legend>
            HTML FORM
        </legend>

        <!-- to create html forms for user input -->
    <label for="email">Enter Email Id:</label>
    <input type="text" id="email" placeholder="Enter your email"> <br>

    <br>
    <label for="pass">Enter password:</label>
    <input type="text" id="pass" placeholder="Enter your password">
    <br>

    <input type="submit" value="Submit">     
    <button>Submit</button>

    <input type="radio" id="male">
    <label for="male">Male</label>

    <input type="checkbox" id="male">
    <label for="male">Male</label>

    <input type="date" id="date">
    <label for="date">Choose Date</label> <br>
<br>

    <label for="selector">Choose Snacks</label>
    <select name="snacks" id="selector">
        <option value="maggi">Maggi</option>
        <option value="kurkere">Kurkere</option>
        <option value="chips">Chips</option>
    </select>

    <br>
    <br>

    <textarea name="area" id="area" cols="30" rows="10" placeholder="Enter text here"></textarea>
    </fieldset>

    </form>
</body>
</html>
